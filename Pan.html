<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScmdEo7ZO8e7PfxmTQIAwBezdR3LBHSHKfFOEm19usGA&s=10">
  <script>

  <style>
    :root {
      --orange: #E6A15C;
      --stroke-glow: rgba(230, 161, 92, 0.4);
      --bg-color: #120f17;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Fredoka', sans-serif;
      overflow-x: hidden;
      color: #f3f4f6;
    }

    /* Papel Picado Banner Styling */
    .papel-picado {
      background: repeating-linear-gradient(
        90deg,
        #E91E63 0px, #E91E63 80px,
        #FF5719 80px, #FF5719 160px,
        #00BCD4 160px, #00BCD4 240px,
        #8E24AA 240px, #8E24AA 320px,
        #4CAF50 320px, #4CAF50 400px
      );
      clip-path: polygon(
        0% 0%, 100% 0%, 100% 70%, 
        95% 100%, 90% 70%, 85% 100%, 80% 70%, 75% 100%, 70% 70%, 65% 100%, 60% 70%,
        55% 100%, 50% 70%, 45% 100%, 40% 70%, 35% 100%, 30% 70%, 25% 100%, 20% 70%,
        15% 100%, 10% 70%, 5% 100%, 0% 70%
      );
    }

    /* SVG Base & Path Styles */
    #bread-svg {
      max-height: 68vh;
      width: auto;
      margin: auto;
      display: block;
      filter: drop-shadow(0 0 14px var(--stroke-glow));
      transition: filter 0.5s ease;
    }

    #bread-svg path {
      fill: none;
      stroke: var(--orange);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-miterlimit: 10;
      transition: stroke 0.5s ease;
    }

    #bread-svg path.st-detail {
      stroke-width: 2.5;
    }

    #bread-svg path.st-fine {
      stroke-width: 1.5;
      stroke-dasharray: 2 4;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1b1822;
    }
    ::-webkit-scrollbar-thumb {
      background: #FF5719;
      border-radius: 4px;
    }

    /* Glow animation for completed drawing */
    .glow-active #bread-svg path {
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 2px var(--orange));
      }
      100% {
        filter: drop-shadow(0 0 10px var(--orange));
      }
    }
  </style>
</head>

  <!-- Lógica de la Aplicación -->
  <script>
    // Sintetizador de Audio con Web Audio API para Efectos Festivos
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.enabled = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      playChime(freq, duration = 0.15) {
        if (!this.enabled || !this.ctx) return;
        
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.log("Audio suprimido por el navegador");
        }
      }

      playCompletionSound() {
        if (!this.enabled || !this.ctx) return;
        // Acorde cálido de guitarra / arpa
        const notes = [293.66, 369.99, 440.00, 587.33, 739.99]; // D4, F#4, A4, D5, F#5
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playChime(freq, 0.5), idx * 100);
        });
      }
    }

    const sound = new SoundSynth();

    // Conversión dinámica de formas SVG a <path>
    function SVG(tag) {
      return document.createElementNS('http://www.w3.org/2000/svg', tag);
    }

    function replaceRectsWithPaths(parentElement) {
      $(parentElement).find('rect').each(function() {
        const x = parseFloat($(this).attr('x') || 0);
        const y = parseFloat($(this).attr('y') || 0);
        const w = parseFloat($(this).attr('width') || 0);
        const h = parseFloat($(this).attr('height') || 0);
        const d = `M${x},${y} L${x + w},${y} L${x + w},${y + h} L${x},${y + h} Z`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replaceLinesWithPaths(parentElement) {
      $(parentElement).find('line').each(function() {
        const x1 = $(this).attr('x1') || 0;
        const y1 = $(this).attr('y1') || 0;
        const x2 = $(this).attr('x2') || 0;
        const y2 = $(this).attr('y2') || 0;
        const d = `M${x1},${y1} L${x2},${y2}`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replaceCirclesWithPaths(parentElement) {
      $(parentElement).find('circle').each(function() {
        const cx = parseFloat($(this).attr('cx') || 0);
        const cy = parseFloat($(this).attr('cy') || 0);
        const r = parseFloat($(this).attr('r') || 0);
        const r2 = r * 2;
        const d = `M ${cx}, ${cy} m ${-r}, 0 a ${r},${r} 0 1,0 ${r2},0 a ${r},${r} 0 1,0 ${-r2},0`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replaceEllipsesWithPaths(parentElement) {
      $(parentElement).find('ellipse').each(function() {
        const cx = parseFloat($(this).attr('cx') || 0);
        const cy = parseFloat($(this).attr('cy') || 0);
        const rx = parseFloat($(this).attr('rx') || 0);
        const ry = parseFloat($(this).attr('ry') || 0);
        const d = `M ${cx}, ${cy} m ${-rx}, 0 a ${rx},${ry} 0 1,0 ${rx * 2},0 a ${rx},${ry} 0 1,0 ${-rx * 2},0`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replacePolygonsWithPaths(parentElement) {
      $(parentElement).find('polygon').each(function() {
        const points = $(this).attr('points');
        if (points) {
          const d = `M ${points} Z`;
          $(SVG('path'))
            .attr('d', d)
            .attr('class', $(this).attr('class') || '')
            .insertAfter(this);
        }
        $(this).remove();
      });
    }

    function replacePolylinesWithPaths(parentElement) {
      $(parentElement).find('polyline').each(function() {
        const points = $(this).attr('points');
        if (points) {
          const d = `M ${points}`;
          $(SVG('path'))
            .attr('d', d)
            .attr('class', $(this).attr('class') || '')
            .insertAfter(this);
        }
        $(this).remove();
      });
    }

    function convertAllToPaths(svgElement) {
      replaceRectsWithPaths(svgElement);
      replaceLinesWithPaths(svgElement);
      replaceEllipsesWithPaths(svgElement);
      replaceCirclesWithPaths(svgElement);
      replacePolygonsWithPaths(svgElement);
      replacePolylinesWithPaths(svgElement);
    }

    // Definición de Paletas Temáticas Mexicanas
    const PALETTES = {
      tradicional: {
        name: 'Pan Tradicional (Azúcar & Mantequilla)',
        bg: '#141018',
        colors: ['#FFC107', '#E6A15C', '#FFF9E6', '#D97706', '#FF8C00']
      },
      cempasuchil: {
        name: 'Cempasúchil & Terciopelo',
        bg: '#160d1a',
        colors: ['#FF5719', '#FFC107', '#E91E63', '#9C27B0', '#FF8A65']
      },
      chocolate: {
        name: 'Chocolate & Canela',
        bg: '#120a08',
        colors: ['#D97706', '#8D6E63', '#4E342E', '#FFB74D', '#FFF3E0']
      },
      alebrije: {
        name: 'Alebrije Neón',
        bg: '#0a0a14',
        colors: ['#FF007F', '#00E5FF', '#76FF03', '#FFEA00', '#D500F9']
      },
      noche: {
        name: 'Noche de Muertos',
        bg: '#080811',
        colors: ['#AB47BC', '#1E88E5', '#FF9800', '#00BCD4', '#FFD54F']
      }
    };

    let activePaletteKey = 'tradicional';
    let isMulticolorMode = true;
    let isGlowEnabled = true;

    // Motor de Animación de Trazos
    let activeAnimationId = null;
    let animationSpeed = 25;

    function applyPathColors(paths) {
      const palette = PALETTES[activePaletteKey].colors;
      const customColor = $('#custom-stroke-color').val();

      paths.forEach((path, idx) => {
        if (isMulticolorMode) {
          // Asignación armónica por sección/índice
          const colorIndex = idx % palette.length;
          path.style.stroke = palette[colorIndex];
        } else {
          path.style.stroke = customColor;
        }
      });

      // Configurar variables CSS globales de resplandor y fondo
      const mainColor = isMulticolorMode ? palette[0] : customColor;
      document.documentElement.style.setProperty('--orange', mainColor);
      document.documentElement.style.setProperty('--stroke-glow', mainColor + '66');
      document.documentElement.style.setProperty('--bg-color', PALETTES[activePaletteKey].bg);
    }

    function drawSVGPaths(parentElement, timeDelay) {
      if (activeAnimationId) {
        cancelAnimationFrame(activeAnimationId);
      }

      const paths = $(parentElement).find('path').get();
      $('#container').removeClass('glow-active');

      // Aplicar paleta de colores
      applyPathColors(paths);

      // Ocultar trazos mediante strokeDashoffset
      paths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length} ${length}`;
        path.style.strokeDashoffset = length;
        path.dataset.length = length;
      });

      let currentPathIndex = 0;
      let startTime = null;
      let pathDuration = Math.max(140, timeDelay * 7);

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;

        if (currentPathIndex < paths.length) {
          const path = paths[currentPathIndex];
          const length = parseFloat(path.dataset.length);

          if (length === 0) {
            currentPathIndex++;
            startTime = timestamp;
            activeAnimationId = requestAnimationFrame(step);
            return;
          }

          // Suavizado EaseInOutQuad
          let progress = elapsed / pathDuration;
          if (progress > 1) progress = 1;

          let easeProgress = progress < 0.5 
            ? 2 * progress * progress 
            : -1 + (4 - 2 * progress) * progress;

          const currentOffset = length * (1 - easeProgress);
          path.style.strokeDashoffset = currentOffset;

          if (progress < 1) {
            activeAnimationId = requestAnimationFrame(step);
          } else {
            // Reproducir nota suave cada 3 trazos
            if (currentPathIndex % 3 === 0) {
              sound.playChime(250 + (currentPathIndex * 12) % 350);
            }

            currentPathIndex++;
            startTime = timestamp;
            activeAnimationId = requestAnimationFrame(step);
          }
        } else {
          // Animación finalizada con éxito
          if (isGlowEnabled) {
            $('#container').addClass('glow-active');
          }
          sound.playCompletionSound();
        }
      }

      activeAnimationId = requestAnimationFrame(step);
    }

    // Fondo animado de pétalos y chispas de azúcar
    function initPetalCanvas() {
      const canvas = document.getElementById('petal-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 6 + 3,
        speedY: Math.random() * 1.2 + 0.4,
        speedX: Math.random() * 0.8 - 0.4,
        angle: Math.random() * Math.PI * 2,
        isSugar: Math.random() > 0.6,
        color: Math.random() > 0.3 ? '#E6A15C' : '#FFC107'
      }));

      function render() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach((p) => {
          p.y += p.speedY;
          p.x += Math.sin(p.angle) * 0.6;
          p.angle += 0.02;

          if (p.y > height) {
            p.y = -15;
            p.x = Math.random() * width;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);

          if (p.isSugar) {
            // Chispas de azúcar blancas/doradas
            ctx.fillStyle = '#FFF9E6';
            ctx.fillRect(-p.size/2, -p.size/2, p.size * 0.8, p.size * 0.8);
          } else {
            // Pétalos de cempasúchil
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        });

        requestAnimationFrame(render);
      }

      render();
    }

    // Inicialización y eventos UI
    $(document).ready(function() {
      const $svg = $('#bread-svg');

      // Convertir formas geométricas a caminos SVG
      convertAllToPaths($svg);

      // Ocultar overlay de carga e iniciar
      setTimeout(() => {
        $('#loading-overlay').addClass('opacity-0 pointer-events-none');
        drawSVGPaths($svg, animationSpeed);
      }, 400);

      // Iniciar efectos flotantes
      initPetalCanvas();

      // Evento de botón re-dibujar
      $('#draw-btn').on('click', function() {
        sound.init();
        drawSVGPaths($svg, animationSpeed);
      });

      // Selección de velocidad
      $('.speed-btn').on('click', function() {
        $('.speed-btn')
          .removeClass('bg-panGold text-mictlan font-bold')
          .addClass('hover:bg-gray-700 text-gray-300 font-medium');

        $(this)
          .addClass('bg-panGold text-mictlan font-bold')
          .removeClass('hover:bg-gray-700 text-gray-300 font-medium');

        animationSpeed = parseInt($(this).data('speed'));
        drawSVGPaths($svg, animationSpeed);
      });

      // Cambio de Paletas de Colores
      $('.palette-btn').on('click', function() {
        $('.palette-btn')
          .removeClass('border-gold/50 bg-gold/20 text-gold')
          .addClass('border-gray-700 text-gray-300');

        $(this)
          .addClass('border-gold/50 bg-gold/20 text-gold')
          .removeClass('border-gray-700 text-gray-300');

        activePaletteKey = $(this).data('palette');
        drawSVGPaths($svg, animationSpeed);
      });

      // Alternar Modo Multicolor
      $('#multicolor-mode').on('change', function() {
        isMulticolorMode = $(this).is(':checked');
        drawSVGPaths($svg, animationSpeed);
      });

      // Color Picker Personalizado
      $('#custom-stroke-color').on('input', function() {
        if (!isMulticolorMode) {
          drawSVGPaths($svg, animationSpeed);
        }
      });

      // Alternar Resplandor (Glow)
      $('#glow-toggle-btn').on('click', function() {
        isGlowEnabled = !isGlowEnabled;
        if (isGlowEnabled) {
          $(this).removeClass('bg-gray-700 text-gray-300').addClass('bg-panGold text-mictlan').text('ON');
          $('#container').addClass('glow-active');
        } else {
          $(this).removeClass('bg-panGold text-mictlan').addClass('bg-gray-700 text-gray-300').text('OFF');
          $('#container').removeClass('glow-active');
        }
      });

      // Control de Efectos de Audio
      $('#sound-btn').on('click', function() {
        sound.init();
        sound.enabled = !sound.enabled;

        const $icon = $(this).find('i');
        const $span = $(this).find('span');

        if (sound.enabled) {
          $icon.removeClass('fa-volume-xmark').addClass('fa-volume-high text-gold');
          $span.text('Audio Activado');
          sound.playChime(440.00, 0.2);
        } else {
          $icon.removeClass('fa-volume-high text-gold').addClass('fa-volume-xmark text-panGold');
          $span.text('Efectos de Audio');
        }
      });
    });
  </script>
</body>
