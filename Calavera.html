<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Decora tu Calaverita de Azúcar! - Día de Muertos</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Rye (Festive Mexican Signage) & Fredoka (Friendly Sans) -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Rye&display=swap" rel="stylesheet">
  <link rel="icon" href="https://i.ytimg.com/vi/hVj7ZDfgmmA/sddefault.jpg">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cempasuchil: '#FF5719',
            gold: '#FFC107',
            mictlan: '#1b1b2f',
            papelPurple: '#8E24AA',
            papelPink: '#E91E63',
            papelCyan: '#00BCD4',
          },
          fontFamily: {
            rye: ['Rye', 'serif'],
            fredoka: ['Fredoka', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --orange: #FF5719;
      --stroke-glow: rgba(255, 87, 25, 0.4);
      --bg-color: #121216;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Fredoka', sans-serif;
      overflow-x: hidden;
      color: #f3f4f6;
    }

    /* Papel Picado Banner Styling */
    .papel-picado {
      background: repeating-linear-gradient(
        90deg,
        #E91E63 0px, #E91E63 80px,
        #FF5719 80px, #FF5719 160px,
        #00BCD4 160px, #00BCD4 240px,
        #8E24AA 240px, #8E24AA 320px,
        #4CAF50 320px, #4CAF50 400px
      );
      clip-path: polygon(
        0% 0%, 100% 0%, 100% 70%, 
        95% 100%, 90% 70%, 85% 100%, 80% 70%, 75% 100%, 70% 70%, 65% 100%, 60% 70%,
        55% 100%, 50% 70%, 45% 100%, 40% 70%, 35% 100%, 30% 70%, 25% 100%, 20% 70%,
        15% 100%, 10% 70%, 5% 100%, 0% 70%
      );
    }

    /* SVG Base & Path Styles */
    #skull-svg {
      max-height: 70vh;
      width: auto;
      margin: auto;
      display: block;
      filter: drop-shadow(0 0 12px var(--stroke-glow));
      transition: filter 0.5s ease;
    }

    #skull-svg path {
      fill: none;
      stroke: var(--orange);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-miterlimit: 10;
      transition: stroke 0.5s ease;
    }

    #skull-svg path.st1 {
      stroke-width: 2;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1b1b2f;
    }
    ::-webkit-scrollbar-thumb {
      background: #FF5719;
      border-radius: 4px;
    }

    /* Glow animation for completed drawing */
    .glow-active #skull-svg path {
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 2px var(--orange));
      }
      100% {
        filter: drop-shadow(0 0 8px var(--orange));
      }
    }
  </style>
</head>

  <script>
    // Audio Context Synthesizer for Festive Chimes
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.enabled = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      playChime(freq, duration = 0.15) {
        if (!this.enabled || !this.ctx) return;
        
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.log("Audio play suppressed");
        }
      }

      playCompletionSound() {
        if (!this.enabled || !this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playChime(freq, 0.4), idx * 120);
        });
      }
    }

    const sound = new SoundSynth();

    // SVG Element Conversion Functions (Converts basic shapes to printable <path> tags)
    function SVG(tag) {
      return document.createElementNS('http://www.w3.org/2000/svg', tag);
    }

    function replaceRectsWithPaths(parentElement) {
      $(parentElement).find('rect').each(function() {
        const x = parseFloat($(this).attr('x') || 0);
        const y = parseFloat($(this).attr('y') || 0);
        const w = parseFloat($(this).attr('width') || 0);
        const h = parseFloat($(this).attr('height') || 0);
        const d = `M${x},${y} L${x + w},${y} L${x + w},${y + h} L${x},${y + h} Z`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replaceLinesWithPaths(parentElement) {
      $(parentElement).find('line').each(function() {
        const x1 = $(this).attr('x1') || 0;
        const y1 = $(this).attr('y1') || 0;
        const x2 = $(this).attr('x2') || 0;
        const y2 = $(this).attr('y2') || 0;
        const d = `M${x1},${y1} L${x2},${y2}`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replaceCirclesWithPaths(parentElement) {
      $(parentElement).find('circle').each(function() {
        const cx = parseFloat($(this).attr('cx') || 0);
        const cy = parseFloat($(this).attr('cy') || 0);
        const r = parseFloat($(this).attr('r') || 0);
        const r2 = r * 2;
        const d = `M ${cx}, ${cy} m ${-r}, 0 a ${r},${r} 0 1,0 ${r2},0 a ${r},${r} 0 1,0 ${-r2},0`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replaceEllipsesWithPaths(parentElement) {
      $(parentElement).find('ellipse').each(function() {
        const cx = parseFloat($(this).attr('cx') || 0);
        const cy = parseFloat($(this).attr('cy') || 0);
        const rx = parseFloat($(this).attr('rx') || 0);
        const ry = parseFloat($(this).attr('ry') || 0);
        const d = `M ${cx}, ${cy} m ${-rx}, 0 a ${rx},${ry} 0 1,0 ${rx * 2},0 a ${rx},${ry} 0 1,0 ${-rx * 2},0`;

        $(SVG('path'))
          .attr('d', d)
          .attr('class', $(this).attr('class') || '')
          .insertAfter(this);
        $(this).remove();
      });
    }

    function replacePolygonsWithPaths(parentElement) {
      $(parentElement).find('polygon').each(function() {
        const points = $(this).attr('points');
        if (points) {
          const polyPoints = points.trim().split(/[ ,]+/);
          const endPoint = `${polyPoints[0]},${polyPoints[1]}`;
          const d = `M ${points} Z`;

          $(SVG('path'))
            .attr('d', d)
            .attr('class', $(this).attr('class') || '')
            .insertAfter(this);
        }
        $(this).remove();
      });
    }

    function replacePolylinesWithPaths(parentElement) {
      $(parentElement).find('polyline').each(function() {
        const points = $(this).attr('points');
        if (points) {
          const d = `M ${points}`;
          $(SVG('path'))
            .attr('d', d)
            .attr('class', $(this).attr('class') || '')
            .insertAfter(this);
        }
        $(this).remove();
      });
    }

    function convertAllToPaths(svgElement) {
      replaceRectsWithPaths(svgElement);
      replaceLinesWithPaths(svgElement);
      replaceEllipsesWithPaths(svgElement);
      replaceCirclesWithPaths(svgElement);
      replacePolygonsWithPaths(svgElement);
      replacePolylinesWithPaths(svgElement);
    }

    // Color Palette Definitions
    const PALETTES = {
      cempasuchil: {
        name: 'Cempasúchil & Papel Picado',
        bg: '#121216',
        colors: ['#FF5719', '#FFC107', '#E91E63', '#9C27B0', '#00BCD4']
      },
      alebrije: {
        name: 'Alebrije Neón',
        bg: '#0a0a14',
        colors: ['#00E5FF', '#FF007F', '#76FF03', '#FFEA00', '#D500F9']
      },
      catrina: {
        name: 'Catrina Elegante',
        bg: '#141113',
        colors: ['#FFD700', '#DC143C', '#FFFFFF', '#C0C0C0', '#FFA500']
      },
      noche: {
        name: 'Noche de Muertos',
        bg: '#080811',
        colors: ['#AB47BC', '#1E88E5', '#FF9800', '#FFD54F', '#26A69A']
      },
      terciopelo: {
        name: 'Flor de Terciopelo',
        bg: '#120813',
        colors: ['#C2185B', '#7B1FA2', '#00ACC1', '#FFB300', '#E91E63']
      }
    };

    let activePaletteKey = 'cempasuchil';
    let isMulticolorMode = true;
    let isGlowEnabled = true;

    // SVG Path Animation Engine
    let activeAnimationId = null;
    let animationSpeed = 25; // Delay multiplier

    function applyPathColors(paths) {
      const palette = PALETTES[activePaletteKey].colors;
      const customColor = $('#custom-stroke-color').val();

      paths.forEach((path, idx) => {
        if (isMulticolorMode) {
          // Color assignment by SVG group index / layer type
          const colorIndex = idx % palette.length;
          path.style.stroke = palette[colorIndex];
        } else {
          path.style.stroke = customColor;
        }
      });

      // Update background and glow parameters
      const mainColor = isMulticolorMode ? palette[0] : customColor;
      document.documentElement.style.setProperty('--orange', mainColor);
      document.documentElement.style.setProperty('--stroke-glow', mainColor + '66');
      document.documentElement.style.setProperty('--bg-color', PALETTES[activePaletteKey].bg);
    }

    function drawSVGPaths(parentElement, timeDelay) {
      if (activeAnimationId) {
        cancelAnimationFrame(activeAnimationId);
      }

      const paths = $(parentElement).find('path').get();
      $('#container').removeClass('glow-active');

      // Apply Palette/Multicolor settings to stroke attributes
      applyPathColors(paths);

      // Initialize all paths as invisible (dasharray offset)
      paths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length} ${length}`;
        path.style.strokeDashoffset = length;
        path.dataset.length = length;
      });

      let currentPathIndex = 0;
      let startTime = null;
      let pathDuration = Math.max(150, timeDelay * 8);

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;

        if (currentPathIndex < paths.length) {
          const path = paths[currentPathIndex];
          const length = parseFloat(path.dataset.length);

          if (length === 0) {
            currentPathIndex++;
            startTime = timestamp;
            activeAnimationId = requestAnimationFrame(step);
            return;
          }

          // EaseInOutQuad
          let progress = elapsed / pathDuration;
          if (progress > 1) progress = 1;

          let easeProgress = progress < 0.5 
            ? 2 * progress * progress 
            : -1 + (4 - 2 * progress) * progress;

          const currentOffset = length * (1 - easeProgress);
          path.style.strokeDashoffset = currentOffset;

          if (progress < 1) {
            activeAnimationId = requestAnimationFrame(step);
          } else {
            // Path complete, play sound chime
            if (currentPathIndex % 4 === 0) {
              sound.playChime(300 + (currentPathIndex * 3) % 400);
            }

            currentPathIndex++;
            startTime = timestamp;
            activeAnimationId = requestAnimationFrame(step);
          }
        } else {
          // Entire skull completed!
          if (isGlowEnabled) {
            $('#container').addClass('glow-active');
          }
          sound.playCompletionSound();
        }
      }

      activeAnimationId = requestAnimationFrame(step);
    }

    // Floating Petals Background Animation
    function initPetalCanvas() {
      const canvas = document.getElementById('petal-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const petals = Array.from({ length: 30 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 8 + 4,
        speedY: Math.random() * 1.5 + 0.5,
        speedX: Math.random() * 1 - 0.5,
        angle: Math.random() * Math.PI * 2,
        color: Math.random() > 0.3 ? '#FF5719' : '#FFC107'
      }));

      function render() {
        ctx.clearRect(0, 0, width, height);

        petals.forEach((p) => {
          p.y += p.speedY;
          p.x += Math.sin(p.angle) * 0.8;
          p.angle += 0.02;

          if (p.y > height) {
            p.y = -20;
            p.x = Math.random() * width;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        requestAnimationFrame(render);
      }

      render();
    }

    // UI Event Handlers & Initialization
    $(document).ready(function() {
      const $svg = $('#skull-svg');

      // Convert shapes to paths
      convertAllToPaths($svg);

      // Hide loading screen & start initial drawing
      setTimeout(() => {
        $('#loading-overlay').addClass('opacity-0 pointer-events-none');
        drawSVGPaths($svg, animationSpeed);
      }, 500);

      // Initialize background particles
      initPetalCanvas();

      // Trigger redraw button click
      $('#draw-btn').on('click', function() {
        sound.init();
        drawSVGPaths($svg, animationSpeed);
      });

      // Speed selection handler
      $('.speed-btn').on('click', function() {
        $('.speed-btn')
          .removeClass('bg-cempasuchil text-white')
          .addClass('hover:bg-gray-700 text-gray-300');

        $(this)
          .addClass('bg-cempasuchil text-white')
          .removeClass('hover:bg-gray-700 text-gray-300');

        animationSpeed = parseInt($(this).data('speed'));
        drawSVGPaths($svg, animationSpeed);
      });

      // Palette Selection Event Handler
      $('.palette-btn').on('click', function() {
        $('.palette-btn')
          .removeClass('border-gold/50 bg-gold/20 text-gold')
          .addClass('border-gray-700 text-gray-300');

        $(this)
          .addClass('border-gold/50 bg-gold/20 text-gold')
          .removeClass('border-gray-700 text-gray-300');

        activePaletteKey = $(this).data('palette');
        drawSVGPaths($svg, animationSpeed);
      });

      // Multicolor Checkbox Toggle
      $('#multicolor-mode').on('change', function() {
        isMulticolorMode = $(this).is(':checked');
        drawSVGPaths($svg, animationSpeed);
      });

      // Custom Color Picker input
      $('#custom-stroke-color').on('input', function() {
        if (!isMulticolorMode) {
          drawSVGPaths($svg, animationSpeed);
        }
      });

      // Glow Effect Toggle
      $('#glow-toggle-btn').on('click', function() {
        isGlowEnabled = !isGlowEnabled;
        if (isGlowEnabled) {
          $(this).removeClass('bg-gray-700').addClass('bg-cempasuchil').text('ON');
          $('#container').addClass('glow-active');
        } else {
          $(this).removeClass('bg-cempasuchil').addClass('bg-gray-700').text('OFF');
          $('#container').removeClass('glow-active');
        }
      });

      // Sound toggle button
      $('#sound-btn').on('click', function() {
        sound.init();
        sound.enabled = !sound.enabled;

        const $icon = $(this).find('i');
        const $span = $(this).find('span');

        if (sound.enabled) {
          $icon.removeClass('fa-volume-xmark').addClass('fa-volume-high text-gold');
          $span.text('Audio Activado');
          sound.playChime(523.25, 0.2);
        } else {
          $icon.removeClass('fa-volume-high text-gold').addClass('fa-volume-xmark text-cempasuchil');
          $span.text('Música/Efectos');
        }
      });
    });
  </script>
</body>
